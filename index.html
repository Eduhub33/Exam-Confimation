<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Content Tracker</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:#f4f7fb;
    padding:30px;
}

.container{
    max-width:1800px;
    margin:auto;
}

h1{
    color:#0B5ED7;
    margin-bottom:20px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:10px;
}

.toolbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
}

input,select{
    padding:9px 10px;
    border:1px solid #ccc;
    border-radius:6px;
    background:#fff;
}

#search{
    width:320px;
}

button{
    border:0;
    border-radius:6px;
    padding:9px 13px;
    cursor:pointer;
    font-weight:600;
}

button:hover{
    opacity:.9;
}

.btn-primary{
    background:#0B5ED7;
    color:#fff;
}

.btn-success{
    background:#198754;
    color:#fff;
}

.btn-danger{
    background:#dc3545;
    color:#fff;
}

.btn-secondary{
    background:#6c757d;
    color:#fff;
}

.summary{
    margin:10px 0 15px;
    color:#495057;
    font-size:13px;
    font-weight:600;
}

.table-wrapper{
    overflow:auto;
    background:#fff;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1700px;
}

th{
    background:#0B5ED7;
    color:#fff;
    padding:12px 8px;
    font-size:13px;
    position:sticky;
    top:0;
    z-index:2;
    white-space:nowrap;
}

td{
    padding:6px;
    border-bottom:1px solid #eee;
    font-size:13px;
    vertical-align:middle;
}

tr:hover{
    background:#f8fbff;
}

td input,
td select{
    width:100%;
    min-width:100px;
    padding:7px;
    border:1px solid #d5dbe3;
    border-radius:4px;
}

td input:focus,
td select:focus{
    outline:2px solid #9ec5fe;
    border-color:#0B5ED7;
}

.sl-cell{
    width:45px;
    min-width:45px;
    text-align:center;
    font-weight:600;
}

.action-cell{
    white-space:nowrap;
    text-align:center;
    min-width:80px;
}

.action-cell button{
    padding:6px 9px;
}

.status-select.ready{
    background:#d1e7dd;
    color:#0f5132;
}

.status-select.wip{
    background:#ffe5d0;
    color:#9a3412;
}

.status-select.pending{
    background:#f8d7da;
    color:#842029;
}

.status-select.completed{
    background:#cfe2ff;
    color:#084298;
}

.status-select.ongoing{
    background:#fff3cd;
    color:#664d03;
}

tfoot{
    font-weight:bold;
    background:#f2f2f2;
}

tfoot td{
    padding:12px;
}

@media(max-width:900px){

    body{
        padding:15px;
    }

    #search{
        width:220px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="topbar">

        <h1>Exam Content Tracker</h1>

        <div class="toolbar">

            <input
                type="text"
                id="search"
                placeholder="Search Project..."
            >

            <button
                class="btn-primary"
                onclick="addRow()">
                + Add Project
            </button>

            <button
                class="btn-success"
                onclick="saveData()">
                Save
            </button>

            <button
                class="btn-secondary"
                onclick="exportData()">
                Export JSON
            </button>

            <button
                class="btn-secondary"
                onclick="importData()">
                Import JSON
            </button>

            <input
                type="file"
                id="importFile"
                accept=".json"
                style="display:none"
                onchange="handleImport(event)"
            >

            <button
                class="btn-secondary"
                onclick="resetData()">
                Reset
            </button>

        </div>

    </div>


    <div
        class="summary"
        id="summary">
    </div>


    <div class="table-wrapper">

        <table id="examTable">

            <thead>

                <tr>

                    <th>Sl.</th>

                    <th>Project</th>

                    <th>Exam Date</th>

                    <th>Applications</th>

                    <th>Scheduled</th>

                    <th>Present</th>

                    <th>IRD/Syllabus Received</th>

                    <th>City Live Date</th>

                    <th>Admit Card Live Date</th>

                    <th>QP</th>

                    <th>Status</th>

                    <th>Content Request</th>

                    <th>Content Delivery</th>

                    <th>Content Status</th>

                    <th>Result Submit Date</th>

                    <th>Remark</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody></tbody>


            <tfoot>

                <tr>

                    <td
                        colspan="17"
                        id="totals">
                    </td>

                </tr>

            </tfoot>

        </table>

    </div>

</div>


<script>

/* =====================================================
   DEFAULT DATA
===================================================== */

const defaultExams = [

    {
        sl:1,
        project:"PSPCL (Punjabi Lang)",
        date:"20-07-2026",
        applications:2431,
        scheduled:0,
        present:0,
        ird:"",
        cityLive:"",
        admitCard:"",
        qp:1,
        status:"Scheduled",
        request:"--",
        delivery:"--",
        content:"Ready",
        resultSubmit:"",
        remark:"Exam Completed"
    },

    {
        sl:2,
        project:"NBCC",
        date:"25-07-2026",
        applications:10664,
        scheduled:0,
        present:0,
        ird:"",
        cityLive:"",
        admitCard:"",
        qp:10,
        status:"Scheduled",
        request:"--",
        delivery:"--",
        content:"Ready",
        resultSubmit:"",
        remark:""
    },

    {
        sl:3,
        project:"SPMCIL - IGM (Re-Exam)",
        date:"03-08-2026",
        applications:4,
        scheduled:0,
        present:0,
        ird:"",
        cityLive:"",
        admitCard:"",
        qp:1,
        status:"Scheduled",
        request:"--",
        delivery:"--",
        content:"Ready",
        resultSubmit:"",
        remark:""
    },

    {
        sl:4,
        project:"NHIDCL Stage 2",
        date:"12-08-2026",
        applications:742,
        scheduled:0,
        present:0,
        ird:"",
        cityLive:"",
        admitCard:"",
        qp:4,
        status:"Scheduled",
        request:"18-07-2026",
        delivery:"06-08-2026",
        content:"WIP",
        resultSubmit:"",
        remark:""
    },

    {
        sl:5,
        project:"EDCIL-SMPCIL CNP",
        date:"18-08-2026",
        applications:1500,
        scheduled:0,
        present:0,
        ird:"",
        cityLive:"",
        admitCard:"",
        qp:2,
        status:"Scheduled",
        request:"20-07-2026",
        delivery:"10-08-2026",
        content:"Pending",
        resultSubmit:"",
        remark:""
    }

];


/* =====================================================
   LOAD SAVED DATA
===================================================== */

let exams =
    JSON.parse(
        localStorage.getItem(
            "examTrackerData"
        )
    ) || JSON.parse(
        JSON.stringify(defaultExams)
    );


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value){

    return String(value ?? "")
        .replace(
            /[&<>"']/g,

            function(c){

                return {
                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#39;"
                }[c];

            }
        );

}


/* =====================================================
   STATUS CLASS
===================================================== */

function statusClass(value){

    return String(value)
        .toLowerCase()
        .replace(/\s+/g,"-");

}


/* =====================================================
   INPUT CREATOR
===================================================== */

function input(
    value,
    field,
    type="text"
){

    return `
        <input
            type="${type}"
            value="${esc(value)}"
            data-field="${field}"
            oninput="updateRow(this)"
        >
    `;

}


/* =====================================================
   STATUS DROPDOWN
===================================================== */

function statusSelect(value){

    const options = [

        "Scheduled",
        "Ongoing",
        "Completed",
        "Cancelled",
        "On Hold"

    ];

    return `

        <select
            data-field="status"
            onchange="updateRow(this)"
        >

            ${options.map(function(option){

                return `

                    <option
                        value="${option}"
                        ${option === value
                            ? "selected"
                            : ""}
                    >
                        ${option}
                    </option>

                `;

            }).join("")}

        </select>

    `;

}


/* =====================================================
   CONTENT STATUS
===================================================== */

function contentSelect(value){

    const options = [

        "Ready",
        "WIP",
        "Pending",
        "Completed"

    ];

    return `

        <select
            class="status-select ${statusClass(value)}"
            data-field="content"
            onchange="
                updateRow(this);
                this.className =
                'status-select ' +
                statusClass(this.value);
            "
        >

            ${options.map(function(option){

                return `

                    <option
                        value="${option}"
                        ${option === value
                            ? "selected"
                            : ""}
                    >
                        ${option}
                    </option>

                `;

            }).join("")}

        </select>

    `;

}


/* =====================================================
   LOAD TABLE
===================================================== */

function loadTable(){

    const searchText =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const tbody =
        document.querySelector(
            "#examTable tbody"
        );


    const rows = exams
        .map(function(item,index){

            return {
                item:item,
                index:index
            };

        })
        .filter(function(row){

            return Object
                .values(row.item)
                .join(" ")
                .toLowerCase()
                .includes(searchText);

        });


    tbody.innerHTML =
        rows.map(function(row){

            const x = row.item;
            const i = row.index;

            return `

                <tr data-index="${i}">

                    <td class="sl-cell">
                        ${i + 1}
                    </td>


                    <td>
                        ${input(
                            x.project,
                            "project"
                        )}
                    </td>


                    <td>
                        ${input(
                            x.date,
                            "date",
                            "date"
                        )}
                    </td>


                    <td>
                        ${input(
                            x.applications,
                            "applications",
                            "number"
                        )}
                    </td>


                    <td>
                        ${input(
                            x.scheduled,
                            "scheduled",
                            "number"
                        )}
                    </td>


                    <td>
                        ${input(
                            x.present,
                            "present",
                            "number"
                        )}
                    </td>


                    <td>
                        ${input(
                            x.ird,
                            "ird"
                        )}
                    </td>


                    <td>
                        ${input(
                            x.cityLive,
                            "cityLive",
                            "date"
                        )}
                    </td>


                    <td>
                        ${input(
                            x.admitCard,
                            "admitCard",
                            "date"
                        )}
                    </td>


                    <td>
                        ${input(
                            x.qp,
                            "qp",
                            "number"
                        )}
                    </td>


                    <td>
                        ${statusSelect(
                            x.status
                        )}
                    </td>


                    <td>
                        ${input(
                            x.request,
                            "request"
                        )}
                    </td>


                    <td>
                        ${input(
                            x.delivery,
                            "delivery"
                        )}
                    </td>


                    <td>
                        ${contentSelect(
                            x.content
                        )}
                    </td>


                    <td>
                        ${input(
                            x.resultSubmit,
                            "resultSubmit",
                            "date"
                        )}
                    </td>


                    <td>
                        ${input(
                            x.remark,
                            "remark"
                        )}
                    </td>


                    <td class="action-cell">

                        <button
                            class="btn-danger"
                            onclick="deleteRow(${i})"
                        >
                            Delete
                        </button>

                    </td>

                </tr>

            `;

        }).join("");


    updateSummary();

}


/* =====================================================
   UPDATE ANY FIELD
===================================================== */

function updateRow(element){

    const row =
        element.closest("tr");


    const index =
        Number(
            row.dataset.index
        );


    const field =
        element.dataset.field;


    const numericFields = [

        "applications",
        "scheduled",
        "present",
        "qp"

    ];


    if(
        numericFields.includes(field)
    ){

        exams[index][field] =
            Number(
                element.value || 0
            );

    }
    else{

        exams[index][field] =
            element.value;

    }


    updateSummary();

}


/* =====================================================
   ADD NEW PROJECT
===================================================== */

function addRow(){

    exams.push({

        sl:exams.length + 1,

        project:"New Project",

        date:"",

        applications:0,

        scheduled:0,

        present:0,

        ird:"",

        cityLive:"",

        admitCard:"",

        qp:0,

        status:"Scheduled",

        request:"",

        delivery:"",

        content:"Pending",

        resultSubmit:"",

        remark:""

    });


    renumber();

    loadTable();


    const rows =
        document.querySelectorAll(
            "#examTable tbody tr"
        );


    if(rows.length){

        rows[
            rows.length - 1
        ]
        .querySelector(
            'input[data-field="project"]'
        )
        .select();

    }

}


/* =====================================================
   DELETE
===================================================== */

function deleteRow(index){

    if(
        confirm(
            "Are you sure you want to delete this project?"
        )
    ){

        exams.splice(
            index,
            1
        );

        renumber();

        saveData(false);

        loadTable();

    }

}


/* =====================================================
   RENUMBER
===================================================== */

function renumber(){

    exams.forEach(
        function(item,index){

            item.sl =
                index + 1;

        }
    );

}


/* =====================================================
   SAVE
===================================================== */

function saveData(showMessage=true){

    renumber();

    localStorage.setItem(

        "examTrackerData",

        JSON.stringify(
            exams
        )

    );


    if(showMessage){

        alert(
            "All dashboard data has been saved successfully."
        );

    }

}


/* =====================================================
   EXPORT JSON
===================================================== */

function exportData(){

    const data =
        JSON.stringify(
            exams,
            null,
            4
        );


    const blob =
        new Blob(
            [data],
            {
                type:
                "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href = url;

    link.download =
        "Exam_Content_Tracker_Data.json";


    document.body.appendChild(
        link
    );

    link.click();

    document.body.removeChild(
        link
    );

    URL.revokeObjectURL(
        url
    );

}


/* =====================================================
   IMPORT JSON
===================================================== */

function importData(){

    document
        .getElementById(
            "importFile"
        )
        .click();

}


function handleImport(event){

    const file =
        event.target.files[0];


    if(!file){

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            try{

                const imported =
                    JSON.parse(
                        e.target.result
                    );


                if(
                    !Array.isArray(
                        imported
                    )
                ){

                    throw new Error(
                        "Invalid data"
                    );

                }


                exams =
                    imported;


                renumber();

                saveData(false);

                loadTable();


                alert(
                    "Data imported successfully."
                );

            }
            catch(error){

                alert(
                    "Invalid JSON file."
                );

            }


            event.target.value = "";

        };


    reader.readAsText(
        file
    );

}


/* =====================================================
   RESET
===================================================== */

function resetData(){

    if(
        confirm(
            "Reset dashboard to original data?"
        )
    ){

        exams =
            JSON.parse(
                JSON.stringify(
                    defaultExams
                )
            );


        localStorage.removeItem(
            "examTrackerData"
        );


        loadTable();

    }

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

    const totalProjects =
        exams.length;


    const totalApplications =
        exams.reduce(
            function(total,item){

                return total +
                    (
                        Number(
                            item.applications
                        ) || 0
                    );

            },
            0
        );


    const totalScheduled =
        exams.reduce(
            function(total,item){

                return total +
                    (
                        Number(
                            item.scheduled
                        ) || 0
                    );

            },
            0
        );


    const totalPresent =
        exams.reduce(
            function(total,item){

                return total +
                    (
                        Number(
                            item.present
                        ) || 0
                    );

            },
            0
        );


    const ready =
        exams.filter(
            function(item){

                return item.content ===
                    "Ready";

            }
        ).length;


    const wip =
        exams.filter(
            function(item){

                return item.content ===
                    "WIP";

            }
        ).length;


    const pending =
        exams.filter(
            function(item){

                return item.content ===
                    "Pending";

            }
        ).length;


    document
        .getElementById(
            "summary"
        )
        .textContent =

        "Projects: " +
        totalProjects +

        " | Applications: " +
        totalApplications.toLocaleString() +

        " | Scheduled: " +
        totalScheduled.toLocaleString() +

        " | Present: " +
        totalPresent.toLocaleString() +

        " | Ready: " +
        ready +

        " | WIP: " +
        wip +

        " | Pending: " +
        pending;


    document
        .getElementById(
            "totals"
        )
        .textContent =

        "TOTAL — Projects: " +
        totalProjects +

        " | Applications: " +
        totalApplications.toLocaleString() +

        " | Scheduled: " +
        totalScheduled.toLocaleString() +

        " | Present: " +
        totalPresent.toLocaleString() +

        " | Ready: " +
        ready +

        " | WIP: " +
        wip +

        " | Pending: " +
        pending;

}


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById(
        "search"
    )
    .addEventListener(
        "input",
        loadTable
    );


/* =====================================================
   INITIAL LOAD
===================================================== */

loadTable();

</script>

</body>
</html>
