<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Content Tracker</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif
}

body{
    background:#f4f7fb;
    padding:30px
}

.container{
    max-width:1500px;
    margin:auto
}

h1{
    color:#0B5ED7;
    margin-bottom:20px
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:10px
}

.toolbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center
}

input,select{
    padding:9px 10px;
    border:1px solid #ccc;
    border-radius:6px;
    background:#fff
}

#search{
    width:320px
}

button{
    border:0;
    border-radius:6px;
    padding:9px 13px;
    cursor:pointer;
    font-weight:600
}

.btn-primary{
    background:#0B5ED7;
    color:#fff
}

.btn-success{
    background:#198754;
    color:#fff
}

.btn-danger{
    background:#dc3545;
    color:#fff
}

.btn-secondary{
    background:#6c757d;
    color:#fff
}

button:hover{
    opacity:.9
}

table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    box-shadow:0 5px 15px rgba(0,0,0,.08)
}

th{
    background:#0B5ED7;
    color:#fff;
    padding:12px;
    font-size:14px;
    position:sticky;
    top:0;
    z-index:1
}

td{
    padding:7px;
    border-bottom:1px solid #eee;
    font-size:14px;
    vertical-align:middle
}

tr:hover{
    background:#f8fbff
}

td input,
td select{
    width:100%;
    min-width:80px;
    padding:7px;
    border:1px solid #d5dbe3;
    border-radius:4px
}

td input:focus,
td select:focus{
    outline:2px solid #9ec5fe;
    border-color:#0B5ED7
}

.sl-cell{
    width:45px;
    text-align:center;
    font-weight:600
}

.action-cell{
    white-space:nowrap;
    text-align:center
}

.action-cell button{
    padding:6px 9px;
    margin:1px
}

.status-select.ready{
    background:#d1e7dd;
    color:#0f5132
}

.status-select.wip{
    background:#ffe5d0;
    color:#9a3412
}

.status-select.pending{
    background:#f8d7da;
    color:#842029
}

.status-select.completed{
    background:#cfe2ff;
    color:#084298
}

tfoot{
    font-weight:bold;
    background:#f2f2f2
}

.summary{
    margin:10px 0 15px;
    color:#495057;
    font-size:13px
}

@media(max-width:900px){

    table{
        display:block;
        overflow:auto;
        white-space:nowrap
    }

    #search{
        width:220px
    }
}
</style>

</head>

<body>

<div class="container">

<div class="topbar">

<h1>Exam Content Tracker</h1>

<div class="toolbar">

<input
    type="text"
    id="search"
    placeholder="Search Project..."
>

<button
    class="btn-primary"
    onclick="addRow()">
    + Add Project
</button>

<button
    class="btn-success"
    onclick="saveData()">
    Save
</button>

<button
    class="btn-secondary"
    onclick="exportData()">
    Export JSON
</button>

<button
    class="btn-secondary"
    onclick="resetData()">
    Reset
</button>

</div>

</div>

<div
    class="summary"
    id="summary">
</div>

<table id="examTable">

<thead>

<tr>

<th>Sl.</th>
<th>Project</th>
<th>Exam Date</th>
<th>Applications</th>
<th>QP</th>
<th>Status</th>
<th>Content Request</th>
<th>Content Delivery</th>
<th>Content Status</th>
<th>Remark</th>
<th>Action</th>

</tr>

</thead>

<tbody></tbody>

<tfoot>

<tr>

<td
    colspan="11"
    id="totals">
</td>

</tr>

</tfoot>

</table>

</div>


<script>

/* =========================
   DEFAULT PROJECT DATA
========================= */

const defaultExams = [

{
    sl:1,
    project:"PSPCL (Punjabi Lang)",
    date:"20-07-2026",
    applications:2431,
    qp:1,
    status:"Scheduled",
    request:"--",
    delivery:"--",
    content:"Ready",
    remark:"Exam Completed"
},

{
    sl:2,
    project:"NBCC",
    date:"25-07-2026",
    applications:10664,
    qp:10,
    status:"Scheduled",
    request:"--",
    delivery:"--",
    content:"Ready",
    remark:""
},

{
    sl:3,
    project:"SPMCIL - IGM (Re-Exam)",
    date:"03-08-2026",
    applications:4,
    qp:1,
    status:"Scheduled",
    request:"--",
    delivery:"--",
    content:"Ready",
    remark:""
},

{
    sl:4,
    project:"NHIDCL Stage 2",
    date:"12-08-2026",
    applications:742,
    qp:4,
    status:"Scheduled",
    request:"18-07-2026",
    delivery:"06-08-2026",
    content:"WIP",
    remark:""
},

{
    sl:5,
    project:"EDCIL-SMPCIL CNP",
    date:"18-08-2026",
    applications:1500,
    qp:2,
    status:"Scheduled",
    request:"20-07-2026",
    delivery:"10-08-2026",
    content:"Pending",
    remark:""
}

];


/* =========================
   LOAD SAVED DATA
========================= */

let exams =
    JSON.parse(
        localStorage.getItem("examTrackerData")
    ) || defaultExams;


/* =========================
   HTML ESCAPE
========================= */

function esc(value){

    return String(value ?? "")
        .replace(
            /[&<>"']/g,

            c => ({
                '&':'&amp;',
                '<':'&lt;',
                '>':'&gt;',
                '"':'&quot;',
                "'":'&#39;'
            }[c])
        );

}


/* =========================
   STATUS CLASS
========================= */

function statusClass(value){

    return String(value)
        .toLowerCase()
        .replace(/\s+/g,'-');

}


/* =========================
   CREATE INPUT
========================= */

function input(
    value,
    field,
    type="text"
){

    return `
    <input
        type="${type}"
        value="${esc(value)}"
        data-field="${field}"
        oninput="updateRow(this)"
    >
    `;

}


/* =========================
   STATUS DROPDOWN
========================= */

function statusSelect(
    value,
    field="status"
){

    const options = [

        "Scheduled",
        "Ongoing",
        "Completed",
        "Cancelled",
        "On Hold"

    ];

    return `

    <select
        data-field="${field}"
        onchange="updateRow(this)"
    >

        ${options.map(o => `

            <option
                ${o === value ? "selected" : ""}
            >
                ${o}
            </option>

        `).join("")}

    </select>

    `;

}


/* =========================
   CONTENT STATUS
========================= */

function contentSelect(value){

    const options = [

        "Ready",
        "WIP",
        "Pending",
        "Completed"

    ];

    return `

    <select
        class="status-select ${statusClass(value)}"
        data-field="content"
        onchange="
            updateRow(this);
            this.className =
            'status-select ' +
            statusClass(this.value)
        "
    >

        ${options.map(o => `

            <option
                ${o === value ? "selected" : ""}
            >
                ${o}
            </option>

        `).join("")}

    </select>

    `;

}


/* =========================
   LOAD TABLE
========================= */

function loadTable(){

    const txt =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const tbody =
        document.querySelector(
            "#examTable tbody"
        );

    const rows =
        exams
        .map((x,i) => ({x,i}))
        .filter(o =>
            o.x.project
            .toLowerCase()
            .includes(txt)
        );


    tbody.innerHTML = rows.map(
        ({x,i}) => `

        <tr data-index="${i}">

            <td class="sl-cell">
                ${i+1}
            </td>


            <td>
                ${input(
                    x.project,
                    "project"
                )}
            </td>


            <td>
                ${input(
                    x.date,
                    "date"
                )}
            </td>


            <td>
                ${input(
                    x.applications,
                    "applications",
                    "number"
                )}
            </td>


            <td>
                ${input(
                    x.qp,
                    "qp",
                    "number"
                )}
            </td>


            <td>
                ${statusSelect(
                    x.status
                )}
            </td>


            <td>
                ${input(
                    x.request,
                    "request"
                )}
            </td>


            <td>
                ${input(
                    x.delivery,
                    "delivery"
                )}
            </td>


            <td>
                ${contentSelect(
                    x.content
                )}
            </td>


            <td>
                ${input(
                    x.remark,
                    "remark"
                )}
            </td>


            <td class="action-cell">

                <button
                    class="btn-danger"
                    onclick="deleteRow(${i})"
                >
                    Delete
                </button>

            </td>

        </tr>

        `
    ).join("");


    updateSummary();

}


/* =========================
   UPDATE ROW
========================= */

function updateRow(el){

    const tr =
        el.closest("tr");

    const i =
        Number(
            tr.dataset.index
        );

    const field =
        el.dataset.field;


    exams[i][field] =

        (
            field === "applications" ||
            field === "qp"
        )

        ? Number(el.value || 0)

        : el.value;


    updateSummary();

}


/* =========================
   ADD PROJECT
========================= */

function addRow(){

    exams.push({

        sl:exams.length+1,

        project:"New Project",

        date:"",

        applications:0,

        qp:0,

        status:"Scheduled",

        request:"--",

        delivery:"--",

        content:"Pending",

        remark:""

    });


    renumber();

    loadTable();


    const rows =
        document.querySelectorAll(
            "#examTable tbody tr"
        );


    if(rows.length){

        rows[
            rows.length - 1
        ]
        .querySelector(
            'input[data-field="project"]'
        )
        .select();

    }

}


/* =========================
   DELETE PROJECT
========================= */

function deleteRow(i){

    if(
        confirm(
            "Delete this project row?"
        )
    ){

        exams.splice(i,1);

        renumber();

        loadTable();

        saveData(false);

    }

}


/* =========================
   RENUMBER
========================= */

function renumber(){

    exams.forEach(
        (x,i) => x.sl = i+1
    );

}


/* =========================
   SAVE DATA
========================= */

function saveData(show=true){

    renumber();

    localStorage.setItem(

        "examTrackerData",

        JSON.stringify(exams)

    );


    if(show){

        alert(
            "Dashboard data saved successfully in this browser."
        );

    }

}


/* =========================
   RESET DATA
========================= */

function resetData(){

    if(
        confirm(
            "Reset all data to the original dashboard data?"
        )
    ){

        exams =
            JSON.parse(
                JSON.stringify(
                    defaultExams
                )
            );

        localStorage.removeItem(
            "examTrackerData"
        );

        loadTable();

    }

}


/* =========================
   EXPORT JSON
========================= */

function exportData(){

    const blob =
        new Blob(

            [
                JSON.stringify(
                    exams,
                    null,
                    2
                )
            ],

            {
                type:
                "application/json"
            }

        );


    const a =
        document.createElement("a");


    a.href =
        URL.createObjectURL(
            blob
        );


    a.download =
        "Exam_Content_Tracker_Data.json";


    a.click();


    URL.revokeObjectURL(
        a.href
    );

}


/* =========================
   SUMMARY
========================= */

function updateSummary(){

    const total =
        exams.length;


    const applications =
        exams.reduce(

            (s,x) =>
                s +
                (Number(
                    x.applications
                ) || 0),

            0

        );


    const ready =
        exams.filter(
            x =>
            x.content === "Ready"
        ).length;


    const pending =
        exams.filter(
            x =>
            x.content === "Pending"
        ).length;


    document
        .getElementById(
            "summary"
        )
        .textContent =

        `Projects: ${total} | ` +
        `Applications: ${applications.toLocaleString()} | ` +
        `Ready: ${ready} | ` +
        `Pending: ${pending}`;


    document
        .getElementById(
            "totals"
        )
        .textContent =

        `Total Projects: ${total} | ` +
        `Total Applications: ${applications.toLocaleString()} | ` +
        `Ready: ${ready} | ` +
        `Pending: ${pending}`;

}


/* =========================
   SEARCH
========================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        loadTable
    );


/* =========================
   INITIAL LOAD
========================= */

loadTable();

</script>

</body>
</html>
